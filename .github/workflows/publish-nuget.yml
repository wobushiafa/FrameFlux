name: Publish NuGet packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version (for example, 0.2.0 or 0.2.0-preview.1)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget.org
    env:
      DOTNET_NOLOGO: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Install Android workload
        run: dotnet workload install android

      - name: Resolve package version
        id: package-version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${MANUAL_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid NuGet package version: ${version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Restore
        run: dotnet restore FrameFlux.slnx -p:EnableWindowsTargeting=true

      - name: Pack managed projects
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          pack() {
            dotnet pack "$1" \
              --configuration Release \
              --no-restore \
              --disable-build-servers \
              --output artifacts/packages \
              -p:BuildInParallel=false \
              -p:EnableWindowsTargeting=true \
              -p:Version="${PACKAGE_VERSION}"
          }

          pack src/FrameFlux.Abstractions/FrameFlux.Abstractions.csproj
          pack src/FrameFlux.Presentation/FrameFlux.Presentation.csproj
          pack src/FrameFlux.FFmpeg/FrameFlux.FFmpeg.csproj
          pack src/FrameFlux.FFmpeg.Android/FrameFlux.FFmpeg.Android.csproj
          pack src/FrameFlux.Rendering.Windows/FrameFlux.Rendering.Windows.csproj
          pack src/FrameFlux.Wpf/FrameFlux.Wpf.csproj
          pack src/FrameFlux.Avalonia/FrameFlux.Avalonia.csproj
          pack src/FrameFlux.Avalonia.Windows/FrameFlux.Avalonia.Windows.csproj
          pack src/FrameFlux.Avalonia.Linux/FrameFlux.Avalonia.Linux.csproj
          pack src/FrameFlux.Avalonia.Android/FrameFlux.Avalonia.Android.csproj

      - name: Verify package set
        shell: bash
        run: |
          package_count="$(find artifacts/packages -maxdepth 1 -name '*.nupkg' ! -name '*.symbols.nupkg' | wc -l)"
          if [[ "${package_count}" -ne 10 ]]; then
            echo "Expected 10 managed NuGet packages, found ${package_count}." >&2
            find artifacts/packages -maxdepth 1 -type f -print
            exit 1
          fi

          if find artifacts/packages -maxdepth 1 -type f -iname '*NativeAssets*' | grep -q .; then
            echo "Native asset packages must not be published by this workflow." >&2
            exit 1
          fi

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frameflux-nuget-${{ steps.package-version.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

      - name: Log in to NuGet.org with trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${NUGET_API_KEY}"
          --skip-duplicate

      - name: Publish symbols to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/packages/*.snupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${NUGET_API_KEY}"
          --skip-duplicate
